[package]
name = "chaos-upstream-watch"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Nightly upstream watch: compares Chaos Mesh releases with docs/chaos-mesh-survey.md and writes suggestions"
publish = false

[[bin]]
name = "chaos-upstream-watch"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

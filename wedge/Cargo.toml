[package]
name = "chaos-wedge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "chaos-wedge"
path = "src/main.rs"

[dependencies]
chaoswedge-model = { path = "target/generated-sources/model" }
servicemanager = { path = "target/generated-sources/model/chassis/servicemanager" }
logger = { path = "target/generated-sources/model/chassis/logger" }
chaos-policy = { path = "../policy" }
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["transport"] }
# The CRI client (cri/api.proto, build.rs), over the containerd socket.
tonic-prost = "0.14"
prost = "0.14"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
tracing = "0.1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# setns into a pod's network namespace, and signals to the stress process.
libc = "0.2"
# The Kubernetes API, read-only: a namespace's labels (nsproxy's fleet labels).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
token = { path = "target/generated-sources/model/chassis/token" }
key = { path = "target/generated-sources/model/chassis/key" }
tempfile = "3"
